[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "btg-backend"
version = "0.1.0"
description = "Bio-Telemetry Gateway backend service."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "BTG Contributors" }]
dependencies = [
    "btg-sdk",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "uvicorn>=0.29",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
buttplug = [
    "buttplug>=1.0.0",
]
ble = [
    "bleak>=0.21",
]
xiaomi = [
    "bleak>=0.21",
    "xiaomi-ble>=1.0.0",
]
coyote = [
    "bleak>=0.21",
]
mqtt = [
    "paho-mqtt>=2.0",
]
npu-hailo = [
    "hailo-platform>=4.16",
]
npu-rknn = [
    "rknn-toolkit2>=2.0",
]
mediapipe = [
    "opencv-python-headless>=4.8",
    "mediapipe>=0.10",
]
vision = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
]
onvif = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "onvif-python>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/btg/biotelemetry-gateway"

# 插件双轨加载的第二轨道：第三方包通过 entry point 注册插件模块，
# 内核 Loader 读取 `importlib.metadata` 中 `btg.plugins` 组完成发现。
# 内置模块由内核直接 import `btg.modules.*`，无需在此登记。
# 示例：my_band = "my_package.plugins:MyBandModule"
[project.entry-points."btg.plugins"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["btg*"]
