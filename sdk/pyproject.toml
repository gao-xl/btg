[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "btg-sdk"
version = "0.1.0"
description = "Bio-Telemetry Gateway plugin SDK: abstract base classes, registry, hooks and shared types for hardware & third-party plugins."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "BTG Contributors" }]
keywords = ["iot", "telemetry", "edge", "plugins", "ble"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/btg/biotelemetry-gateway"

[tool.setuptools.packages.find]
where = ["."]
include = ["btg_sdk*"]