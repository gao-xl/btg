  # ── 主机 + 开发板方案（MQTT 远程设备）────────────────────────────────
  # 前置：pip install "btg-backend[mqtt]"，并在主机起 Mosquitto；
  # 板端运行 board_agent 薄代理。真实采集/执行跑在板端，主机仅当它们是
  # 普通设备。板掉线时按 priority 自动切到本地 backup。
